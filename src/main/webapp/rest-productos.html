<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="manifest" href="manifest.json">

    <title>Productos - Cafefe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        #productos {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 20px;

            max-width: 1200px;

            margin: 0 auto;
        }

    </style>

</head>

<body>

    <h1>Productos Cafefe</h1>

    <div id="productos"></div>

    <script
        type="module"
        src="js/productos.js">
    </script>

</body>

</html>
