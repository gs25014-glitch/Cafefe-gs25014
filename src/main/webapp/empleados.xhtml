<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Empleados - Cafefe</title>
    <link rel="stylesheet" type="text/css" href="css/estilo.css" />
</h:head>

<h:body>

    <div class="barra">
        <a href="index.html" class="marca">Cafefe</a>
        <a href="index.html">← Volver al menú</a>
    </div>

    <div class="contenedor">

    <h1>Empleados - Cafefe</h1>

    <h:messages infoClass="msg-info" warnClass="msg-warn" errorClass="msg-error" globalOnly="true" />

    <h2>#{empleadoBean.editando ? 'Editar empleado' : 'Crear empleado'}</h2>

    <h:form>

        <h:outputLabel
            for="nombre"
            value="Nombre:" />

        <h:inputText
            id="nombre"
            value="#{empleadoBean.empleado.nombre}"
            required="true"
            requiredMessage="El nombre es obligatorio." />

        <h:message errorClass="msg-error" for="nombre" />

        <br /><br />

        <h:outputLabel
            for="apellido"
            value="Apellido:" />

        <h:inputText
            id="apellido"
            value="#{empleadoBean.empleado.apellido}"
            required="true"
            requiredMessage="El apellido es obligatorio." />

        <h:message errorClass="msg-error" for="apellido" />

        <br /><br />

        <h:outputLabel
            for="activo"
            value="Activo:" />

        <h:selectBooleanCheckbox
            id="activo"
            value="#{empleadoBean.empleado.activo}" />

        <br /><br />

        <h:outputLabel for="rol" value="Rol:" />
        


        <h:selectOneMenu id="rol"
                         value="#{empleadoBean.idRolSeleccionado}"
                         disabled="#{empleadoBean.editando}"
                         required="#{not empleadoBean.editando}"
                         requiredMessage="Debe seleccionar un rol">

            <f:selectItem
                itemLabel="Seleccione un rol"
                itemValue="#{null}"
                noSelectionOption="true" />

            <f:selectItems
                value="#{empleadoBean.opcionesRoles}" />

        </h:selectOneMenu>

        <h:message errorClass="msg-error" for="rol" />

        <br /><br />

        <h:outputLabel
            for="comentarios"
            value="Comentarios:" />

        <h:inputTextarea
            id="comentarios"
            value="#{empleadoBean.empleado.comentarios}" />

        <br /><br />

        <h:commandButton
            value="#{empleadoBean.editando ? 'Guardar cambios' : 'Guardar empleado'}"
            action="#{empleadoBean.guardar}" />

        <h:commandButton
            value="Cancelar"
            action="#{empleadoBean.cancelar}"
            immediate="true" />

    </h:form>

    <hr />

    <h2>Lista de empleados</h2>

    <h:form>

        <h:dataTable
            styleClass="tabla"
            value="#{empleadoBean.empleados}"
            var="empleado">

            <h:column>

                <f:facet name="header">
                    ID
                </f:facet>

                <h:outputText
                    value="#{empleado.idEmpleado}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Nombre
                </f:facet>

                <h:outputText
                    value="#{empleado.nombre}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Apellido
                </f:facet>

                <h:outputText
                    value="#{empleado.apellido}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Rol
                </f:facet>

                <h:outputText
                    value="#{empleadoBean.obtenerNombreRol(empleado.idEmpleado)}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Activo
                </f:facet>

                <h:outputText
                    value="#{empleado.activo ? 'Sí' : 'No'}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Comentarios
                </f:facet>

                <h:outputText
                    value="#{empleado.comentarios}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Acciones
                </f:facet>

                <h:commandButton
                    value="Editar"
                    action="#{empleadoBean.editar(empleado)}" />

                <h:commandButton
                    value="Eliminar"
                    action="#{empleadoBean.eliminar(empleado)}" />

            </h:column>

        </h:dataTable>

    </h:form>

    </div>

</h:body>

</html>
