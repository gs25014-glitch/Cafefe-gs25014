<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Empleados - Cafefe</title>
</h:head>

<h:body>

    <h1>Empleados - Cafefe</h1>

    <h2>Crear empleado</h2>

    <h:form>

        <h:outputLabel
            for="nombre"
            value="Nombre:" />

        <h:inputText
            id="nombre"
            value="#{empleadoBean.empleado.nombre}"
            required="true"
            requiredMessage="El nombre es obligatorio." />

        <h:message for="nombre" />

        <br /><br />

        <h:outputLabel
            for="apellido"
            value="Apellido:" />

        <h:inputText
            id="apellido"
            value="#{empleadoBean.empleado.apellido}"
            required="true"
            requiredMessage="El apellido es obligatorio." />

        <h:message for="apellido" />

        <br /><br />

        <h:outputLabel
            for="activo"
            value="Activo:" />

        <h:selectBooleanCheckbox
            id="activo"
            value="#{empleadoBean.empleado.activo}" />

        <br /><br />

        <h:outputLabel for="rol" value="Rol:" />
        


        <h:selectOneMenu id="rol"
                         value="#{empleadoBean.idRolSeleccionado}"
                         required="true"
                         requiredMessage="Debe seleccionar un rol">

            <f:selectItem
                itemLabel="Seleccione un rol"
                itemValue="#{null}"
                noSelectionOption="true" />

            <f:selectItems
                value="#{empleadoBean.opcionesRoles}" />

        </h:selectOneMenu>

        <h:message for="rol" />

        <br /><br />

        <h:outputLabel
            for="comentarios"
            value="Comentarios:" />

        <h:inputTextarea
            id="comentarios"
            value="#{empleadoBean.empleado.comentarios}" />

        <br /><br />

        <h:commandButton
            value="Guardar empleado"
            action="#{empleadoBean.guardar}" />

    </h:form>

    <hr />

    <h2>Lista de empleados</h2>

    <h:form>

        <h:dataTable
            value="#{empleadoBean.empleados}"
            var="empleado"
            border="1">

            <h:column>

                <f:facet name="header">
                    ID
                </f:facet>

                <h:outputText
                    value="#{empleado.idEmpleado}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Nombre
                </f:facet>

                <h:outputText
                    value="#{empleado.nombre}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Apellido
                </f:facet>

                <h:outputText
                    value="#{empleado.apellido}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Rol
                </f:facet>

                <h:outputText
                    value="#{empleadoBean.obtenerNombreRol(empleado.idEmpleado)}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Activo
                </f:facet>

                <h:outputText
                    value="#{empleado.activo ? 'Sí' : 'No'}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Comentarios
                </f:facet>

                <h:outputText
                    value="#{empleado.comentarios}" />

            </h:column>

            <h:column>

                <f:facet name="header">
                    Acciones
                </f:facet>

                <h:commandButton
                    value="Editar"
                    action="#{empleadoBean.editar(empleado)}" />

                <h:commandButton
                    value="Eliminar"
                    action="#{empleadoBean.eliminar(empleado)}" />

            </h:column>

        </h:dataTable>

    </h:form>

    <h:panelGroup
        rendered="#{empleadoBean.empleadoSeleccionado != null}">

        <hr />

        <h2>Editar empleado</h2>

        <h:form>

            <h:outputLabel
                for="nombreEditar"
                value="Nombre:" />

            <h:inputText
                id="nombreEditar"
                value="#{empleadoBean.empleadoSeleccionado.nombre}"
                required="true"
                requiredMessage="El nombre es obligatorio." />

            <h:message for="nombreEditar" />

            <br /><br />

            <h:outputLabel
                for="apellidoEditar"
                value="Apellido:" />

            <h:inputText
                id="apellidoEditar"
                value="#{empleadoBean.empleadoSeleccionado.apellido}"
                required="true"
                requiredMessage="El apellido es obligatorio." />

            <h:message for="apellidoEditar" />

            <br /><br />

            <h:outputLabel
                for="activoEditar"
                value="Activo:" />

            <h:selectBooleanCheckbox
                id="activoEditar"
                value="#{empleadoBean.empleadoSeleccionado.activo}" />

            <br /><br />

            <h:outputLabel
                for="comentariosEditar"
                value="Comentarios:" />

            <h:inputTextarea
                id="comentariosEditar"
                value="#{empleadoBean.empleadoSeleccionado.comentarios}" />

            <br /><br />

            <h:commandButton
                value="Guardar cambios"
                action="#{empleadoBean.actualizar}" />

        </h:form>

    </h:panelGroup>

</h:body>

</html>
