<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Tipos de producto - Cafefe</title>
    <link rel="stylesheet" type="text/css" href="css/estilo.css" />
</h:head>

<h:body>

    <div class="barra">
        <a href="index.html" class="marca">Cafefe</a>
        <a href="index.html">← Volver al menú</a>
    </div>

    <div class="contenedor">

    <h1>Tipos de producto - Cafefe</h1>

    <h2>Crear tipo de producto</h2>

    <h:form>

        <h:outputLabel value="Nombre:" />

        <h:inputText
            id="nombre"
            value="#{tipoProductoBean.tipoProducto.nombre}"
            required="true"
            requiredMessage="El nombre es obligatorio." />

        <h:message errorClass="msg-error" for="nombre" />

        <br /><br />

        <h:outputLabel value="Activo:" />

        <h:selectBooleanCheckbox
            value="#{tipoProductoBean.tipoProducto.activo}" />

        <br /><br />

        <h:outputLabel value="Observaciones:" />

        <h:inputTextarea
            value="#{tipoProductoBean.tipoProducto.observaciones}" />

        <br /><br />

        <h:commandButton
            value="Guardar tipo de producto"
            action="#{tipoProductoBean.guardar}" />

    </h:form>

    <hr />

    <h2>Lista de tipos de producto</h2>

    <h:form>

        <h:dataTable
            styleClass="tabla"
            value="#{tipoProductoBean.tiposProducto}"
            var="tipoProducto">

            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText
                    value="#{tipoProducto.idTipoProducto}" />
            </h:column>

            <h:column>
                <f:facet name="header">Nombre</f:facet>
                <h:outputText
                    value="#{tipoProducto.nombre}" />
            </h:column>

            <h:column>
                <f:facet name="header">Activo</f:facet>
                <h:outputText
                    value="#{tipoProducto.activo ? 'Sí' : 'No'}" />
            </h:column>

            <h:column>
                <f:facet name="header">Observaciones</f:facet>
                <h:outputText
                    value="#{tipoProducto.observaciones}" />
            </h:column>

            <h:column>
                <f:facet name="header">Acciones</f:facet>
                <h:commandButton
                    value="Editar"
                    action="#{tipoProductoBean.editar(tipoProducto)}" />
                <h:commandButton
                    value="Eliminar"
                    action="#{tipoProductoBean.eliminar(tipoProducto)}" />
            </h:column>

        </h:dataTable>

    </h:form>

    <h:panelGroup
        rendered="#{tipoProductoBean.tipoProductoSeleccionado != null}">

        <hr />

        <h2>Editar tipo de producto</h2>

        <h:form>

            <h:outputLabel value="Nombre:" />

            <h:inputText
                id="nombreEditar"
                value="#{tipoProductoBean.tipoProductoSeleccionado.nombre}"
                required="true"
                requiredMessage="El nombre es obligatorio." />

            <h:message errorClass="msg-error" for="nombreEditar" />

            <br /><br />

            <h:outputLabel value="Activo:" />

            <h:selectBooleanCheckbox
                value="#{tipoProductoBean.tipoProductoSeleccionado.activo}" />

            <br /><br />

            <h:outputLabel value="Observaciones:" />

            <h:inputTextarea
                value="#{tipoProductoBean.tipoProductoSeleccionado.observaciones}" />

            <br /><br />

            <h:commandButton
                value="Guardar cambios"
                action="#{tipoProductoBean.actualizar}" />

        </h:form>

    </h:panelGroup>

    </div>

</h:body>

</html>
