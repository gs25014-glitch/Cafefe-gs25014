<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Ordenes - Cafefe</title>
    <link rel="stylesheet" type="text/css" href="css/estilo.css" />
</h:head>

<h:body>

    <div class="barra">
        <a href="index.html" class="marca">Cafefe</a>
        <a href="index.html">← Volver al menú</a>
    </div>

    <div class="contenedor">

    <h1>Crear Orden</h1>

    <h:form>

        <h:messages infoClass="msg-info" warnClass="msg-warn" errorClass="msg-error" />

        <h3>Empleado (solo camareros)</h3>

        <h:selectOneMenu value="#{ordenBean.empleadoSeleccionado}">
            <f:selectItem
                itemLabel="Seleccione un empleado"
                noSelectionOption="true" />

            <f:selectItems
                value="#{ordenBean.empleados}"
                var="empleado"
                itemValue="#{empleado.idEmpleado}"
                itemLabel="#{empleado.nombre} #{empleado.apellido} - #{ordenBean.rolDeEmpleado(empleado)}" />
        </h:selectOneMenu>

        <h3>Caja</h3>

        <h:selectOneMenu value="#{ordenBean.cajaSeleccionada}">

            <f:selectItem
                itemLabel="Seleccione una caja"
                noSelectionOption="true" />

            <f:selectItems
                value="#{ordenBean.cajas}"
                var="caja"
                itemValue="#{caja.idCaja}"
                itemLabel="#{caja.nombre}" />

        </h:selectOneMenu>

        <h3>Fecha de la orden</h3>

        <h:inputText value="#{ordenBean.fechaOrdenTexto}">

            <f:passThroughAttribute
                name="type"
                value="date" />

        </h:inputText>

        <br/>
        <br/>

        <h3>Agregar producto</h3>

        <h:selectOneMenu value="#{ordenBean.productoSeleccionado}">

            <f:selectItem
                itemLabel="Seleccione un producto"
                noSelectionOption="true" />

            <f:selectItems
                value="#{ordenBean.productos}"
                var="producto"
                itemValue="#{producto.idProducto}"
                itemLabel="#{producto.nombre} - $#{producto.precioSugerido}" />

        </h:selectOneMenu>

        <h:commandButton
            value="Agregar producto"
            action="#{ordenBean.agregarProducto}" />

        <br/>
        <br/>

        <h3>Aplicar descuento</h3>

        <h:selectOneMenu value="#{ordenBean.descuentoSeleccionado}">

            <f:selectItem
                itemLabel="Seleccione un descuento"
                noSelectionOption="true" />

            <f:selectItems
                value="#{ordenBean.descuentos}"
                var="descuento"
                itemValue="#{descuento.idDescuento}"
                itemLabel="#{ordenBean.etiquetaDescuento(descuento)}" />

        </h:selectOneMenu>

        <h:commandButton
            value="Aplicar descuento"
            action="#{ordenBean.aplicarDescuento}" />

        <br/>
        <br/>

        <h3>Productos de la orden</h3>

        <h:dataTable
            styleClass="tabla"
            value="#{ordenBean.productosOrden}"
            var="detalle">

            <h:column>
                <f:facet name="header">Producto</f:facet>

                <h:outputText value="#{ordenBean.nombreProducto(detalle.idProducto)}" />
            </h:column>

            <h:column>
                <f:facet name="header">Precio</f:facet>

                <h:outputText value="#{detalle.precio}" />
            </h:column>

            <h:column>
                <f:facet name="header">Comentario</f:facet>

                <h:outputText value="#{detalle.observaciones}" />
            </h:column>

        </h:dataTable>

        <br/>

        <h3>
            Total:
            $<h:outputText value="#{ordenBean.total}" />
        </h3>

        <h:commandButton
            value="Guardar orden"
            action="#{ordenBean.guardarOrden}" />

    </h:form>

    <br/>

    <h2>Órdenes guardadas</h2>

    <h:dataTable
            styleClass="tabla"
        value="#{ordenBean.ordenesGuardadas}"
        var="o">

        <h:column>
            <f:facet name="header">Fecha</f:facet>

            <h:outputText value="#{ordenBean.fechaDeOrden(o)}" />
        </h:column>

        <h:column>
            <f:facet name="header">Empleado</f:facet>

            <h:outputText value="#{ordenBean.empleadoDeOrden(o)}" />
        </h:column>

        <h:column>
            <f:facet name="header">Productos</f:facet>

            <h:dataTable
            styleClass="tabla"
                value="#{ordenBean.detallesDeOrden(o)}"
                var="d">

                <h:column>
                    <f:facet name="header">Producto</f:facet>

                    <h:outputText value="#{ordenBean.nombreProducto(d.idProducto)}" />
                </h:column>

                <h:column>
                    <f:facet name="header">Precio</f:facet>

                    <h:outputText value="#{d.precio}" />
                </h:column>

                <h:column>
                    <f:facet name="header">Comentario</f:facet>

                    <h:outputText value="#{d.observaciones}" />
                </h:column>

            </h:dataTable>
        </h:column>

        <h:column>
            <f:facet name="header">Total</f:facet>

            $<h:outputText value="#{ordenBean.totalDeOrden(o)}" />
        </h:column>

    </h:dataTable>

    </div>

</h:body>

</html>
