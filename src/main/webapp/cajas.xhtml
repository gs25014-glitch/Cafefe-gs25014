<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Cajas - Cafefe</title>
    <link rel="stylesheet" type="text/css" href="css/estilo.css" />
</h:head>

<h:body>

    <div class="barra">
        <a href="index.html" class="marca">Cafefe</a>
        <a href="index.html">← Volver al menú</a>
    </div>

    <div class="contenedor">

    <h1>Cajas - Cafefe</h1>

    <h2>Crear caja</h2>

    <h:form>

        <h:outputLabel value="Nombre:" />

        <h:inputText
            id="nombre"
            value="#{cajaBean.caja.nombre}"
            required="true"
            requiredMessage="El nombre de la caja es obligatorio." />

        <h:message errorClass="msg-error" for="nombre" />

        <br /><br />

        <h:outputLabel value="Activo:" />

        <h:selectBooleanCheckbox
            value="#{cajaBean.caja.activo}" />

        <br /><br />

        <h:outputLabel value="Observaciones:" />

        <h:inputTextarea
            value="#{cajaBean.caja.observaciones}" />

        <br /><br />

        <h:commandButton
            value="Guardar caja"
            action="#{cajaBean.guardar}" />

    </h:form>

    <hr />

    <h2>Lista de cajas</h2>

    <h:form id="formLista">

        <h:messages infoClass="msg-info" warnClass="msg-warn" errorClass="msg-error"
            for="tablaCajas" />

        <h:dataTable
            styleClass="tabla"
            id="tablaCajas"
            value="#{cajaBean.cajas}"
            var="caja">

            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText value="#{caja.idCaja}" />
            </h:column>

            <h:column>
                <f:facet name="header">Nombre</f:facet>
                <h:outputText value="#{caja.nombre}" />
            </h:column>

            <h:column>
                <f:facet name="header">Activo</f:facet>
                <h:outputText value="#{caja.activo ? 'Sí' : 'No'}" />
            </h:column>

            <h:column>
                <f:facet name="header">Observaciones</f:facet>
                <h:outputText value="#{caja.observaciones}" />
            </h:column>

            <h:column>
                <f:facet name="header">Acciones</f:facet>
                <h:commandButton
                    value="Editar"
                    action="#{cajaBean.editar(caja)}" />
                <h:commandButton
                    value="Eliminar"
                    action="#{cajaBean.eliminar(caja)}" />
            </h:column>

        </h:dataTable>

    </h:form>

    <h:panelGroup
        rendered="#{cajaBean.cajaSeleccionada != null}">

        <hr />

        <h2>Editar caja</h2>

        <h:form>

            <h:outputLabel value="Nombre:" />

            <h:inputText
                id="nombreEditar"
                value="#{cajaBean.cajaSeleccionada.nombre}"
                required="true"
                requiredMessage="El nombre de la caja es obligatorio." />

            <h:message errorClass="msg-error" for="nombreEditar" />

            <br /><br />

            <h:outputLabel value="Activo:" />

            <h:selectBooleanCheckbox
                value="#{cajaBean.cajaSeleccionada.activo}" />

            <br /><br />

            <h:outputLabel value="Observaciones:" />

            <h:inputTextarea
                value="#{cajaBean.cajaSeleccionada.observaciones}" />

            <br /><br />

            <h:commandButton
                value="Guardar cambios"
                action="#{cajaBean.actualizar}" />

        </h:form>

    </h:panelGroup>

    </div>

</h:body>

</html>
