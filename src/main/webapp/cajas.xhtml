<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>
    <title>Cajas - Cafefe</title>
</h:head>

<h:body>

    <h1>Cajas - Cafefe</h1>

    <h2>Crear caja</h2>

    <h:form>

        <h:outputLabel value="Nombre:" />

        <h:inputText
            id="nombre"
            value="#{cajaBean.caja.nombre}"
            required="true"
            requiredMessage="El nombre de la caja es obligatorio." />

        <h:message for="nombre" />

        <br /><br />

        <h:outputLabel value="Activo:" />

        <h:selectBooleanCheckbox
            value="#{cajaBean.caja.activo}" />

        <br /><br />

        <h:outputLabel value="Observaciones:" />

        <h:inputTextarea
            value="#{cajaBean.caja.observaciones}" />

        <br /><br />

        <h:commandButton
            value="Guardar caja"
            action="#{cajaBean.guardar}" />

    </h:form>

    <hr />

    <h2>Lista de cajas</h2>

    <h:form>

        <h:dataTable
            value="#{cajaBean.cajas}"
            var="caja"
            border="1">

            <h:column>
                <h:outputText value="ID" />
                <br />
                <h:outputText value="#{caja.idCaja}" />
            </h:column>

            <h:column>
                <h:outputText value="Nombre" />
                <br />
                <h:outputText value="#{caja.nombre}" />
            </h:column>

            <h:column>
                <h:outputText value="Activo" />
                <br />
                <h:outputText value="#{caja.activo}" />
            </h:column>

            <h:column>
                <h:outputText value="Observaciones" />
                <br />
                <h:outputText value="#{caja.observaciones}" />
            </h:column>

            <h:column>
                <h:commandButton
                    value="Editar"
                    action="#{cajaBean.editar(caja)}" />
            </h:column>

            <h:column>
                <h:commandButton
                    value="Eliminar"
                    action="#{cajaBean.eliminar(caja)}" />
            </h:column>

        </h:dataTable>

    </h:form>

    <h:panelGroup
        rendered="#{cajaBean.cajaSeleccionada != null}">

        <hr />

        <h2>Editar caja</h2>

        <h:form>

            <h:outputLabel value="Nombre:" />

            <h:inputText
                id="nombreEditar"
                value="#{cajaBean.cajaSeleccionada.nombre}"
                required="true"
                requiredMessage="El nombre de la caja es obligatorio." />

            <h:message for="nombreEditar" />

            <br /><br />

            <h:outputLabel value="Activo:" />

            <h:selectBooleanCheckbox
                value="#{cajaBean.cajaSeleccionada.activo}" />

            <br /><br />

            <h:outputLabel value="Observaciones:" />

            <h:inputTextarea
                value="#{cajaBean.cajaSeleccionada.observaciones}" />

            <br /><br />

            <h:commandButton
                value="Guardar cambios"
                action="#{cajaBean.actualizar}" />

        </h:form>

    </h:panelGroup>

</h:body>

</html>
