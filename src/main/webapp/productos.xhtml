<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Productos - Cafefe</title>
</h:head>

<h:body>

    <h1>Productos - Cafefe</h1>

    <!-- ============================= -->
    <!-- CREAR PRODUCTO -->
    <!-- ============================= -->

    <h2>Crear producto</h2>

    <h:form id="formProducto">

        <!-- Nombre -->
        <h:outputLabel
            for="nombre"
            value="Nombre:" />

        <h:inputText
            id="nombre"
            value="#{productoBean.producto.nombre}"
            required="true"
            requiredMessage="El nombre del producto es obligatorio." />

        <h:message for="nombre" />

        <br /><br />


        <!-- Precio sugerido -->
        <h:outputLabel
            for="precio"
            value="Precio sugerido:" />

        <h:inputText
            id="precio"
            value="#{productoBean.producto.precioSugerido}"
            required="true"
            requiredMessage="El precio es obligatorio."
            validatorMessage="El precio no puede ser negativo.">

            <f:validateDoubleRange minimum="0" />

        </h:inputText>

        <h:message for="precio" />

        <br /><br />


        <!-- Activo -->
        <h:outputLabel
            for="activo"
            value="Activo:" />

        <h:selectBooleanCheckbox
            id="activo"
            value="#{productoBean.producto.activo}" />

        <br /><br />


        <!-- Tipo de producto -->
        <h:outputLabel
            for="tipoProducto"
            value="Tipo de producto:" />

        <h:selectOneMenu
            id="tipoProducto"
            value="#{productoBean.idTipoProductoSeleccionado}"
            required="true"
            requiredMessage="Debe seleccionar un tipo de producto.">

            <f:selectItem
                itemLabel="Seleccione un tipo de producto"
                itemValue="#{null}"
                noSelectionOption="true" />

            <f:selectItems
                value="#{productoBean.tiposProductoActivos}"
                var="tipo"
                itemValue="#{tipo.idTipoProducto}"
                itemLabel="#{tipo.nombre}" />

        </h:selectOneMenu>

        <h:message for="tipoProducto" />

        <br /><br />


        <!-- ============================= -->
        <!-- CARACTERÍSTICA -->
        <!-- ============================= -->

        <h:outputLabel
            for="caracteristica"
            value="Característica:" />

        <h:selectOneMenu
            id="caracteristica"
            value="#{productoBean.idCaracteristicaSeleccionada}">

            <f:selectItem
                itemLabel="Seleccione una característica"
                itemValue="#{null}"
                noSelectionOption="true" />

            <f:selectItems
                value="#{productoBean.caracteristicasActivas}"
                var="caracteristica"
                itemValue="#{caracteristica.idCaracteristica}"
                itemLabel="#{caracteristica.nombre}" />

        </h:selectOneMenu>

        <br /><br />


        <!-- Valor de característica -->
        <h:outputLabel
            for="valorCaracteristica"
            value="Valor de característica:" />

        <h:inputText
            id="valorCaracteristica"
            value="#{productoBean.valorCaracteristica}" />

        <br /><br />


        <!-- Mensajes -->
        <h:messages
            globalOnly="true"
            style="color:red;" />

        <br />


        <!-- Botón guardar -->
        <h:commandButton
            value="Guardar producto"
            action="#{productoBean.guardar}" />

        <br /><br />

        <!-- Botón nuevo -->
        <h:commandButton
            value="Limpiar"
            action="#{productoBean.nuevoProducto}"
            immediate="true" />

    </h:form>


    <hr />


    <!-- ============================= -->
    <!-- LISTA DE PRODUCTOS -->
    <!-- ============================= -->

    <h2>Lista de productos</h2>

    <h:form id="formLista">

        <h:dataTable
            value="#{productoBean.productos}"
            var="producto"
            border="1">

            <!-- ID -->
            <h:column>

                <h:outputText value="ID" />

                <br />

                <h:outputText
                    value="#{producto.idProducto}" />

            </h:column>


            <!-- Nombre -->
            <h:column>

                <h:outputText value="Nombre" />

                <br />

                <h:outputText
                    value="#{producto.nombre}" />

            </h:column>


            <!-- Precio -->
            <h:column>

                <h:outputText value="Precio" />

                <br />

                <h:outputText
                    value="#{producto.precioSugerido}" />

            </h:column>


            <!-- Tipo de producto -->
            <h:column>

                <h:outputText value="Tipo de producto" />

                <br />

                <h:outputText
                    value="#{productoBean.tipoDeProducto(producto)}" />

            </h:column>


            <!-- Características -->
            <h:column>

                <h:outputText value="Características" />

                <br />

                <h:outputText
                    value="#{productoBean.caracteristicasDeProducto(producto)}" />

            </h:column>


            <!-- Activo -->
            <h:column>

                <h:outputText value="Activo" />

                <br />

                <h:outputText
                    value="#{producto.activo}" />

            </h:column>


            <!-- Comentarios -->
            <h:column>

                <h:outputText value="Comentarios" />

                <br />

                <h:outputText
                    value="#{producto.comentarios}" />

            </h:column>


            <!-- Editar -->
            <h:column>

                <h:commandButton
                    value="Editar"
                    action="#{productoBean.editar(producto)}" />

            </h:column>


            <!-- Eliminar -->
            <h:column>

                <h:commandButton
                    value="Eliminar"
                    action="#{productoBean.eliminar(producto)}" />

            </h:column>

        </h:dataTable>

    </h:form>


    <!-- ============================= -->
    <!-- EDITAR PRODUCTO -->
    <!-- ============================= -->

    <h:panelGroup
        rendered="#{productoBean.productoSeleccionado != null}">

        <hr />

        <h2>Editar producto</h2>

        <h:form id="formEditar">

            <!-- Nombre -->
            <h:outputLabel
                for="nombreEditar"
                value="Nombre:" />

            <h:inputText
                id="nombreEditar"
                value="#{productoBean.productoSeleccionado.nombre}"
                required="true"
                requiredMessage="El nombre es obligatorio." />

            <h:message for="nombreEditar" />

            <br /><br />


            <!-- Precio -->
            <h:outputLabel
                for="precioEditar"
                value="Precio sugerido:" />

            <h:inputText
                id="precioEditar"
                value="#{productoBean.productoSeleccionado.precioSugerido}"
                required="true"
                requiredMessage="El precio es obligatorio."
                validatorMessage="El precio no puede ser negativo.">

                <f:validateDoubleRange minimum="0" />

            </h:inputText>

            <h:message for="precioEditar" />

            <br /><br />


            <!-- Activo -->
            <h:outputLabel
                for="activoEditar"
                value="Activo:" />

            <h:selectBooleanCheckbox
                id="activoEditar"
                value="#{productoBean.productoSeleccionado.activo}" />

            <br /><br />


            <!-- Comentarios -->
            <h:outputLabel
                for="comentariosEditar"
                value="Comentarios:" />

            <h:inputTextarea
                id="comentariosEditar"
                value="#{productoBean.productoSeleccionado.comentarios}" />

            <br /><br />


            <!-- Actualizar -->
            <h:commandButton
                value="Actualizar"
                action="#{productoBean.actualizar}" />

        </h:form>

    </h:panelGroup>

</h:body>

</html>
