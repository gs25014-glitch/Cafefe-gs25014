<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafefe - Sistema POS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #fbf5e9 url("img/fondo.png") center center / cover no-repeat fixed;
        }

        /* Barra del menú */
        nav {
            background-color: #4b2e1e;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
        }

        nav li {
            position: relative;
        }

        /* Título de cada grupo */
        .grupo {
            display: block;
            padding: 15px 22px;
            color: white;
            cursor: pointer;
        }

        nav li:hover .grupo,
        nav li:focus-within .grupo {
            background-color: #b8884a;
        }

        /* Lista desplegable */
        .sub {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 220px;
            background-color: #4b2e1e;
            z-index: 10;
        }

        nav li:hover .sub,
        nav li:focus-within .sub {
            display: block;
        }

        .sub a {
            display: block;
            padding: 12px 22px;
            color: white;
            text-decoration: none;
        }

        .sub a:hover {
            background-color: #b8884a;
        }
    </style>
</head>

<body>

    <nav>
        <ul>

            <li>
                <span class="grupo" tabindex="0">Personal ▾</span>
                <div class="sub">
                    <a href="roles.xhtml">Roles</a>
                    <a href="empleados.xhtml">Empleados</a>
                </div>
            </li>

            <li>
                <span class="grupo" tabindex="0">Características ▾</span>
                <div class="sub">
                    <a href="tipos-caracteristica.xhtml">Tipos de característica</a>
                    <a href="caracteristicas.xhtml">Características</a>
                </div>
            </li>

            <li>
                <span class="grupo" tabindex="0">Descuentos ▾</span>
                <div class="sub">
                    <a href="tipos-descuento.xhtml">Tipos de descuento</a>
                    <a href="descuentos.xhtml">Descuentos</a>
                </div>
            </li>

            <li>
                <span class="grupo" tabindex="0">Productos ▾</span>
                <div class="sub">
                    <a href="tipos-producto.xhtml">Tipos de producto</a>
                    <a href="productos.xhtml">Productos</a>
                </div>
            </li>

            <li>
                <span class="grupo" tabindex="0">Ventas ▾</span>
                <div class="sub">
                    <a href="cajas.xhtml">Cajas</a>
                    <a href="ordenes.xhtml">Órdenes</a>
                </div>
            </li>

        </ul>
    </nav>

</body>
</html>
