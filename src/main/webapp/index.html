<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafefe - Sistema POS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .boton {
            display: block;
            padding: 20px;
            background-color: white;
            color: #333;
            text-decoration: none;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .boton:hover {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cafefe</h1>
        <p>Sistema de Punto de Venta para Cafetería</p>
    </header>

    <div class="contenedor">

        <h2>Menú principal</h2>

        <div class="menu">

            <a class="boton" href="productos.xhtml">
                Productos
            </a>

            <a class="boton" href="tipos-producto.xhtml">
                Tipos de producto
            </a>

            <a class="boton" href="empleados.xhtml">
                Empleados
            </a>

            <a class="boton" href="cajas.xhtml">
                Cajas
            </a>

            <a class="boton" href="ordenes.xhtml">
                Órdenes
            </a>

            <a class="boton" href="pagos.xhtml">
                Pagos
            </a>

            <a class="boton" href="rest-productos.html">
                Productos REST / PWA
            </a>

        </div>

    </div>

</body>
</html>
