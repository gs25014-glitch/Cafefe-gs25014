<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba REST - Cafefe</title>
</head>

<body>

    <h1>Prueba de API REST - Cafefe</h1>

    <h2>Crear producto</h2>

    <form id="productoForm">

        <label>Nombre:</label>
        <input type="text" id="nombre" required>

        <br><br>

        <label>Precio:</label>
        <input type="number" id="precio" step="0.01" min="0" required>

        <br><br>

        <label>Comentarios:</label>
        <input type="text" id="comentarios">

        <br><br>

        <button type="submit">Crear producto</button>

    </form>

    <p id="mensaje"></p>

    <h2>Productos</h2>

    <button id="btnCargar">Cargar productos</button>

    <ul id="listaProductos"></ul>


    <script>

        const formulario = document.querySelector("#productoForm");
        const mensaje = document.querySelector("#mensaje");
        const botonCargar = document.querySelector("#btnCargar");
        const listaProductos = document.querySelector("#listaProductos");


        // Cargar productos
        const cargarProductos = async () => {

            try {

                const respuesta = await fetch("api/productos");

                if (!respuesta.ok) {
                    throw new Error("Error al obtener los productos");
                }

                const productos = await respuesta.json();

                listaProductos.innerHTML = "";


                productos.forEach(producto => {

                    const elemento = document.createElement("li");

                    elemento.textContent =
                        `${producto.nombre} - $${producto.precioSugerido} `;


                    // Botón Editar
                    const botonEditar =
                        document.createElement("button");

                    botonEditar.textContent = "Editar";

                    botonEditar.addEventListener("click", () => {

                        editarProducto(producto);

                    });


                    // Botón Eliminar
                    const botonEliminar =
                        document.createElement("button");

                    botonEliminar.textContent = "Eliminar";

                    botonEliminar.addEventListener("click", () => {

                        eliminarProducto(producto.idProducto);

                    });


                    elemento.appendChild(botonEditar);

                    elemento.appendChild(botonEliminar);

                    listaProductos.appendChild(elemento);

                });


            } catch (error) {

                mensaje.textContent = error.message;

            }

        };


        // Crear producto
        formulario.addEventListener("submit", async (evento) => {

            evento.preventDefault();


            const producto = {

                nombre:
                    document.querySelector("#nombre").value,

                precioSugerido:
                    parseFloat(
                        document.querySelector("#precio").value
                    ),

                activo: true,

                comentarios:
                    document.querySelector("#comentarios").value

            };


            try {

                const respuesta = await fetch("api/productos", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(producto)

                });


                if (!respuesta.ok) {
                    throw new Error("No se pudo crear el producto");
                }


                const productoCreado =
                    await respuesta.json();


                mensaje.textContent =
                    `Producto creado correctamente: ${productoCreado.nombre}`;


                formulario.reset();

                cargarProductos();


            } catch (error) {

                mensaje.textContent = error.message;

            }

        });


        // Actualizar producto
        const editarProducto = async (producto) => {

            const nuevoNombre =
                prompt("Nuevo nombre:", producto.nombre);

            if (nuevoNombre === null) {
                return;
            }


            const nuevoPrecio =
                prompt("Nuevo precio:", producto.precioSugerido);

            if (nuevoPrecio === null) {
                return;
            }


            const productoActualizado = {

                nombre: nuevoNombre,

                precioSugerido:
                    parseFloat(nuevoPrecio),

                activo: producto.activo,

                comentarios: producto.comentarios

            };


            try {

                const respuesta = await fetch(
                    `api/productos/${producto.idProducto}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body:
                            JSON.stringify(productoActualizado)

                    }
                );


                if (!respuesta.ok) {
                    throw new Error(
                        "No se pudo actualizar el producto"
                    );
                }


                mensaje.textContent =
                    "Producto actualizado correctamente.";


                cargarProductos();


            } catch (error) {

                mensaje.textContent = error.message;

            }

        };


        // Eliminar producto
        const eliminarProducto = async (id) => {

            const confirmar =
                confirm("¿Desea eliminar este producto?");


            if (!confirmar) {
                return;
            }


            try {

                const respuesta = await fetch(
                    `api/productos/${id}`,
                    {
                        method: "DELETE"
                    }
                );


                if (!respuesta.ok) {
                    throw new Error(
                        "No se pudo eliminar el producto"
                    );
                }


                mensaje.textContent =
                    "Producto eliminado correctamente.";


                cargarProductos();


            } catch (error) {

                mensaje.textContent = error.message;

            }

        };


        botonCargar.addEventListener("click", () => {

            cargarProductos();

        });

    </script>

</body>
</html>
