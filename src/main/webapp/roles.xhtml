<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Roles - Cafefe</title>
    <link rel="stylesheet" type="text/css" href="css/estilo.css" />
</h:head>

<h:body>

    <div class="barra">
        <a href="index.html" class="marca">Cafefe</a>
        <a href="index.html">← Volver al menú</a>
    </div>

    <div class="contenedor">

    <h1>Roles</h1>

    <h:form id="formRol">

        <h:panelGrid columns="2">

            <h:outputLabel for="nombre" value="Nombre:" />

            <h:inputText
                id="nombre"
                value="#{rolBean.rol.nombre}"
                required="true"
                requiredMessage="El nombre es obligatorio."
            />

            <h:outputLabel for="activo" value="Activo:" />

            <h:selectBooleanCheckbox
                id="activo"
                value="#{rolBean.rol.activo}"
            />

            <h:outputLabel for="observaciones" value="Observaciones:" />

            <h:inputTextarea
                id="observaciones"
                value="#{rolBean.rol.observaciones}"
            />

        </h:panelGrid>

        <br/>

        <h:commandButton
            value="#{rolBean.editando ? 'Actualizar' : 'Guardar'}"
            action="#{rolBean.guardar}"
        />

        <h:commandButton
            value="Nuevo"
            action="#{rolBean.nuevo}"
            immediate="true"
        />

        <h:commandButton
            value="Cancelar"
            action="#{rolBean.cancelar}"
            immediate="true"
            rendered="#{rolBean.editando}"
        />

        <h:messages infoClass="msg-info" warnClass="msg-warn" errorClass="msg-error" />

    </h:form>

    <br/>

    <!-- La tabla va en su propio formulario para que Editar y Eliminar
         no validen el campo Nombre del formulario de arriba -->
    <h:form id="formLista">

        <h:dataTable
            styleClass="tabla"
            value="#{rolBean.roles}"
            var="item"
            rendered="#{not empty rolBean.roles}"
        >

            <h:column>
                <f:facet name="header">Nombre</f:facet>
                #{item.nombre}
            </h:column>

            <h:column>
                <f:facet name="header">Activo</f:facet>
                #{item.activo ? 'Sí' : 'No'}
            </h:column>

            <h:column>
                <f:facet name="header">Observaciones</f:facet>
                #{item.observaciones}
            </h:column>

            <h:column>
                <f:facet name="header">Acciones</f:facet>

                <h:commandButton
                    value="Editar"
                    action="#{rolBean.editar(item)}"
                />

                <h:commandButton
                    value="Eliminar"
                    action="#{rolBean.eliminar(item.idRol)}"
                />

            </h:column>

        </h:dataTable>

    </h:form>
    </div>

</h:body>

</html>
